name: Tests

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: a stacked PR would
  # otherwise run no checks at all.
  pull_request:
  # Reused by publish.yml, so a release cannot skip the suite.
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write          # publish-unit-test-result-action writes a check run
      pull-requests: write   # ...and comments the summary on the PR

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: tests (py${{ matrix.python-version }})

    env:
      # uv takes its interpreter from .python-version before the one on PATH;
      # UV_PYTHON outranks the file, so each leg runs on the Python it names.
      UV_PYTHON: ${{ matrix.python-version }}
      COVERAGE_CORE: sysmon
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen

      - name: The suite runs on the Python this leg names
        run: |
          actual=$(uv run --frozen python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          if [ "$actual" != "$UV_PYTHON" ]; then
            echo "::error::the py$UV_PYTHON leg would run the suite on Python $actual"
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          uv run pytest -v -W default tests/ -m "not integration and not perf" \
            --cov=sc_droplets \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            --junitxml="pytest-results-py$UV_PYTHON.xml"

      - name: Publish test results summary
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: pytest-results-py${{ matrix.python-version }}.xml
          check_name: Test Results (py${{ matrix.python-version }})

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-results-py${{ matrix.python-version }}.xml
          retention-days: 30

  # What `pip install sc-droplets` gets today, not what uv.lock pins: the
  # base package from a fresh resolution, every module imported, and the
  # command run end to end. Catches a module-level import of something
  # undeclared.
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: fresh install, no lock

    permissions:
      contents: read

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install the base package from a fresh resolution
        run: |
          uv venv --python 3.13 fresh
          uv pip install --python fresh/bin/python .
          uv pip list --python fresh/bin/python

      - name: Every module imports, and none pulls in a test-only dependency
        run: |
          fresh/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import sc_droplets
          for module in pkgutil.walk_packages(sc_droplets.__path__, "sc_droplets."):
              importlib.import_module(module.name)
          heavy = {"scanpy", "pytest"} & set(sys.modules)
          if heavy:
              sys.exit(f"importing sc_droplets pulled in {sorted(heavy)}")
          PY

      - name: The command works end to end
        run: |
          mkdir smoke
          cd smoke || exit 1
          ../fresh/bin/python -c "import sc_droplets as scd; scd.simulate_droplets(n_cells=100, n_empty=500, n_low=1000, n_genes=100).write_h5ad('sim.h5ad')"
          ../fresh/bin/sc-droplets methods
          ../fresh/bin/sc-droplets inspect sim.h5ad
          ../fresh/bin/sc-droplets call threshold sim.h5ad --min-counts 150 --barcodes cells.txt
          ../fresh/bin/sc-droplets compare sim.h5ad -m top-n:n_cells=100 -m threshold:min_counts=150 --plot knee.png
          test -s cells.txt && test -s knee.png

  # publish.yml and quay-on-tag.yml run only on a tag, so no pull request
  # runs them. actionlint parses every workflow and shellchecks its scripts;
  # zizmor audits them for injection, unpinned actions and excess
  # permissions. Not on a tag: a new advisory must not stop a release of
  # code that has not changed.
  workflows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: workflow lint

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.31.1 --format github .github/workflows

  # The Docker image, built and run as quay-on-tag.yml will push it, but not
  # pushed. On a tag this workflow runs inside publish.yml, so an image that
  # does not build or run stops the release before PyPI has it.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: container image

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          tags: sc-droplets:candidate

      - name: The image runs, as its own user and as the caller's
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          bash .github/scripts/smoke-image.sh sc-droplets:candidate "$version"

  # Every method against its original tool on public data (tests/test_validation.py):
  # Cell Ranger against 10x's own filtered matrices, STARsolo against STAR's calls
  # (tests/oracles). The datasets (about 1 GB) are cached between runs.
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    name: validation against the original tools

    permissions:
      contents: read

    env:
      SC_DROPLETS_DATA: ${{ github.workspace }}/.cache/datasets
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Restore the public datasets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('tests/datasets.py') }}

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen

      - name: Download what is missing
        run: uv run python tests/datasets.py

      - name: Run the validation tests
        run: uv run pytest -v -W default tests/test_validation.py -m integration --junitxml=validation-results.xml

      - name: Confirm the cases actually ran
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("validation-results.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          ran = int(suite.get("tests", 0)) - int(suite.get("skipped", 0))
          print(f"{ran} validation cases ran")
          if ran < 50:
              sys.exit(f"expected at least 50 validation cases, got {ran}")
          PY

  # The unit suite once more, on the lowest version of each direct dependency
  # that pyproject.toml allows. Without it a floor is a number nobody has
  # installed.
  floors:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: tests at the dependency floors (py${{ matrix.python-version }})

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install the lowest versions pyproject.toml allows
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION"
          uv pip compile pyproject.toml --all-extras --resolution lowest-direct \
            --python-version "$PYTHON_VERSION" -o floors.txt
          uv pip sync floors.txt
          uv pip install --no-deps -e .
          .venv/bin/python .github/scripts/check_floors.py

      - name: Run the unit suite
        run: .venv/bin/python -m pytest -v -rs -W default tests/ -m "not integration"
