          enable-cache: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.80.0
          run-install: false
          cache: false

      - name: Install
        run: uv sync --frozen

      - name: Run DropletUtils
        run: bash oracles/dropletutils/run.sh oracle-out/dropletutils

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
