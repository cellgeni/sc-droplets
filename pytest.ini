[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --timeout=300 --timeout-method=thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    perf: cost guards; CI runs them as a job of their own
    integration: needs the network on the first run (public datasets, oracle environments)
