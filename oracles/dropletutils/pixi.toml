# One R environment per DropletUtils release with a change sc-droplets reproduces, from bioconda.
# Used by run.sh; see README there. The osx-64 pins keep old builds loadable (they need the
# libc++ and libgfortran they were built against). Every environment uses the reference BLAS, as
# R ships it and Bioconductor's containers run it: OpenBLAS on a CPU with FMA changes
# smooth.spline in the last bits.
[workspace]
name = "dropletutils-oracles"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[feature.du100.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.0.3"

[feature.du100.target.osx-64.dependencies]
libcxx = "<15"
libgfortran = "3.*"

[feature.du102.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.2.1"

[feature.du102.target.osx-64.dependencies]
libcxx = "<15"

[feature.du104.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.4.2"

[feature.du104.target.osx-64.dependencies]
libcxx = "<15"

[feature.du106.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.6.1"

[feature.du106.target.osx-64.dependencies]
libcxx = "<15"

[feature.du108.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.8.0"

[feature.du108.target.osx-64.dependencies]
libcxx = "<15"

[feature.du110.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.10.3"
openssl = "1.1.*"  # its rhdf5 links libcrypto 1.1, on both platforms

[feature.du110.target.osx-64.dependencies]
libcxx = "<15"

[feature.du112.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.12.1"

[feature.du112.target.osx-64.dependencies]
libcxx = "<15"

[feature.du114.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.14.2"

[feature.du118.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.18.0"

[feature.du120.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.20.0"

[feature.du126.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.26.0"

[feature.du130.dependencies]
libblas = { version = "*", build = "*netlib" }
bioconductor-dropletutils = "==1.30.0"

[environments]
du100 = { features = ["du100"], no-default-feature = true }
du102 = { features = ["du102"], no-default-feature = true }
du104 = { features = ["du104"], no-default-feature = true }
du106 = { features = ["du106"], no-default-feature = true }
du108 = { features = ["du108"], no-default-feature = true }
du110 = { features = ["du110"], no-default-feature = true }
du112 = { features = ["du112"], no-default-feature = true }
du114 = { features = ["du114"], no-default-feature = true }
du118 = { features = ["du118"], no-default-feature = true }
du120 = { features = ["du120"], no-default-feature = true }
du126 = { features = ["du126"], no-default-feature = true }
du130 = { features = ["du130"], no-default-feature = true }
