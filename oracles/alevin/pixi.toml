# A C++ compiler from conda-forge, to build the oracle's programs from salmon's alevin source.
# Used by run.sh. The committed outputs are linux-64's (gcc and libstdc++, as salmon's Linux builds).
[workspace]
name = "alevin-oracles"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
cxx-compiler = "*"
