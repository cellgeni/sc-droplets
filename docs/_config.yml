# GitHub Pages configuration for the sc-droplets documentation.
# Source is set in Settings -> Pages to "Deploy from a branch": main, /docs.

# Just the Docs gives a sidebar, search and callouts with no build step of our own:
# GitHub Pages fetches the theme through jekyll-remote-theme. Pinned so a theme
# release cannot change the site under us.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache   # needed by the theme
  - jekyll-relative-links  # links between pages are written as page.md

title: sc-droplets
description: Every cell vs empty-droplet calling method, version by version, for droplet single-cell data
url: https://cellgeni.github.io
baseurl: /sc-droplets
# Pages at /page/ rather than /page.html
permalink: pretty

search_enabled: true
heading_anchors: true

aux_links:
  "sc-droplets on GitHub":
    - "https://github.com/cellgeni/sc-droplets"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/cellgeni/sc-droplets"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Callouts used across the pages: {: .note }, {: .warning }, {: .important }
callouts:
  note:
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    color: red

# Formulas: kramdown turns $$...$$ into \(...\) and \[...\], which
# _includes/head_custom.html renders with KaTeX.
kramdown:
  math_engine: mathjax

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Tooling and working notes, not pages
exclude:
  - _scripts
  - _research
  - Gemfile
  - Gemfile.lock
